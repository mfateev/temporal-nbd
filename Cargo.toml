[package]
name = "temporal-nbd"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1"
prost = "0.11"
prost-types = "0.11"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tonic = { version = "0.9", features = ["transport"] }
uuid = { version = "1", features = ["v4"] }

[build-dependencies]
tonic-build = "0.9"
