[package]
name = "temporal-nbd"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1"
async-trait = "0.1"
clap = { version = "4", features = ["derive", "env"] }
libc = "0.2"
nix = { version = "0.30", features = ["fs", "ioctl", "socket"] }
prost = "0.11"
prost-types = "0.11"
rand = "0.8"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = "0.7"
tonic = { version = "0.9", features = ["transport"] }
uuid = { version = "1", features = ["v4"] }

[build-dependencies]
tonic-build = "0.9"
